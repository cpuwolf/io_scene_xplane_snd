schema_version = "1.0.0"

# Blender 扩展清单。仓库根就是扩展根：`blender --command extension build` 直接可用。
# 刻意不声明任何依赖 —— 本插件不需要 XPlane2Blender，也不需要 io_scene_xplane_obj。
id = "io_scene_xplane_snd"
version = "0.1.4"
name = "X-Plane SND Import/Export"
tagline = "Edit X-Plane .snd sound attachments in 3D"
maintainer = "cpuwolf"
type = "add-on"
tags = ["Import-Export"]

website = "https://github.com/cpuwolf/io_scene_xplane_snd"
license = ["SPDX:GPL-3.0-or-later"]

blender_version_min = "5.2.0"

# 4.2+ 的清单要求；写出权限说明便于审查
# 注意：除了用户选的 .snd，原点解析还会读同目录/上级目录里的 .acf（acf/_cgY、_cgZ），
# 所以权限文案必须把 .acf 一起写出来，否则和代码行为不符。
[permissions]
files = "Read/write chosen .snd and nearby .acf files for the origin"

# 从仓库根打包时排除开发文件 —— extension build 不读 .gitignore，
# tests/ 里有 sys.path 操纵、硬编码 bl_ext、以及 import io_scene_xplane_obj，
# 留在包里会被审核按"全局副作用 / 依赖其它 add-on"判违规。
[build]
paths_exclude_pattern = [
  "/.git/",
  "/tests/",
  "/dist/",
  "/__pycache__/",
  "/.github/",
  "/doc/",
  "/branding/",
  "/.gitignore",
  "/.DS_Store",
  "/*.blend1",
]

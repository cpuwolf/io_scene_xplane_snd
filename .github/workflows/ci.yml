name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: syntax and extension metadata checks
        run: python3 tests/ci_lint.py
      - name: regenerate fixtures and make sure they are reproducible
        run: |
          python3 tests/make_fixtures.py
          git diff --exit-code -- tests/fixtures || (echo "fixtures out of date: rerun tests/make_fixtures.py and commit" && exit 1)

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        version: ["5.2.4"]
    steps:
      - uses: actions/checkout@v4

      - name: cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-linux-${{ matrix.version }}

      - name: download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="${MATRIX_VERSION}"
          branch="Blender$(echo "$ver" | cut -d. -f1-2)"
          url="https://download.blender.org/release/$branch/blender-$ver-linux-x64.tar.xz"
          echo "GET $url"
          mkdir -p "$HOME/blender"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/blender.tar.xz "$url"
          tar -xJf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
        env:
          MATRIX_VERSION: ${{ matrix.version }}

      - name: check blender
        run: |
          echo "$HOME/blender" >> "$GITHUB_PATH"
          "$HOME/blender/blender" --version | head -3

      - name: make fixtures
        run: python3 tests/make_fixtures.py

      - name: build extension
        run: |
          mkdir -p dist
          "$HOME/blender/blender" --command extension build --source-dir . --output-dir dist
          ls -l dist

      - name: validate extension metadata
        run: "\"$HOME/blender/blender\" --command extension validate ."

      - name: install and enable extension
        run: "\"$HOME/blender/blender\" --command extension install-file -r user_default -e dist/io_scene_xplane_snd-*.zip"

      - name: smoke test (extension loads, operators registered)
        run: "\"$HOME/blender/blender\" -b --python tests/smoke.py"

      - name: roundtrip fixtures (XP2B axis, byte identical)
        run: "\"$HOME/blender/blender\" -b --factory-startup -P tests/roundtrip.py -- --fixtures"

      - name: roundtrip fixtures (RAW axis)
        run: "\"$HOME/blender/blender\" -b --factory-startup -P tests/roundtrip.py -- --fixtures --raw"

      - name: mutation path (append attachment, insert field)
        run: "\"$HOME/blender/blender\" -b --factory-startup -P tests/mutation.py"

      - name: origin resolution and axis roundtrip
        run: "\"$HOME/blender/blender\" -b --factory-startup -P tests/origin.py"

      - name: upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: io_scene_xplane_snd-blender-${{ matrix.version }}
          path: dist/*.zip
          if-no-files-found: error
